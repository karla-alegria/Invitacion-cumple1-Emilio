<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi primer añito · Portada</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  
<style>
*{box-sizing:border-box;}
html,body{height:100%;}

body{
  margin:0;
  font-family:'Poppins',system-ui,sans-serif;
  background:#eaf4fb;
  display:flex;
  justify-content:center;
  padding:12px 10px;
}

/* ✅ “Hoja” tamaño celular (más corta / compacta) */

.phone{
  width:100%;
  max-width:390px;
  /*min-height:calc(100vh - 24px);*/
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 18px 60px rgba(2,20,40,.16);

  /* Fondo de TODA la hoja */
  background:
    linear-gradient(
      rgba(255,255,255,.50),
      rgba(255,255,255,.50)
    ),
    url("img/fondo1.png") center / cover no-repeat;
}


.card{
  position:relative;
  /* IMPORTANTE: hidden, no visible */
  overflow:hidden;
  padding:16px 14px 140px;
  text-align:center;
  /*width:calc(100% - 36px);
  min-height:calc(100vh - 36px);*/
  margin:18px;
  background:transparent;
  border-radius:24px;
}

/* NO queremos otra capa encima */
.card::before{
  display:none;
}

.card > *{
  position:relative;
  z-index:1;
}

/* ===== MARIO DE ARRIBA ===== */
.hero{
  display:flex;
  justify-content:center;

  /* lo sube */
  margin-top:-15px;
  margin-bottom:16px;
}

.hero img{
  width:180px;
  max-width:100%;
  display:block;
  margin:0 auto;
  filter:drop-shadow(0 14px 26px rgba(2,20,40,.16));
}

/* ===== SOBRE ===== */
.envelopeWrap{
  width:125%;
  max-width:440px;
  /* lo mantiene centrado aunque sea más ancho */
  margin:10px auto 0;
  margin-left:50%;
  transform:translateX(-50%);
  position:relative;
  overflow:visible;
  padding-bottom:135px;
}

.envelopeImg{
  width:100%;
  aspect-ratio:16/10;
  position:relative;
  background:url("img/sobre.png") center / contain no-repeat;
}


/* ===== SELLO ESTRELLA ===== */
.sealBtn{
  position:absolute;
  left:50%;
  /* baja la estrella al sello plateado */
  top:67%;
  transform:translate(-50%,-50%);
  width:56px;
  height:56px;
  background:none;
  border:none;
  cursor:pointer;
  padding:0;
  z-index:100;
}

.sealBtn img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.16));
}

/* ✅ Pase (más grande y sobresale) */
.paseWrap{
  position:absolute;
  top:90%;
  left:50%;
  transform: translate(-50%, -50%); /* centrado matemático */
  z-index:20;

  width: 100%;           /* mismo ancho que el pase */
  max-width: 160vw;       /* permite crecer en móvil */
  display:flex;
  justify-content:center; /* centra el PNG dentro */
}

.paseWrap img{
  width:360px;                     /* 🔥 MÁS GRANDE */
  max-width:40%;                  /* 🔥 sobresale del sobre */
  height:auto;
  filter:none;
}

  .texto-sobre{
  position:absolute;
  left:50%;
  top:34%;
  transform:translate(-50%,-50%);
  width:180px;
  text-align:center;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:700;
  font-size:15px;
  line-height:1.25;
  letter-spacing:1px;
  color:#1f2937;
  z-index:5;
  }

.titulo-mario{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:0;

  font-family:'Luckiest Guy', cursive;
  font-size:30px;
  line-height:1;
  margin:15px auto;
  white-space:nowrap;
}
  
.letra{
  display:inline-block;
  /* Borde de las letras */
  -webkit-text-stroke:2px #1d1d1d;
  /* Efecto 3D 
  text-shadow:
    0 3px 0 #ffffff,
    0 5px 0 #222222,
    2px 7px 4px rgba(0,0,0,.25);*/
}

/* COLORES */
.rojo{ color:#e52521;}

.azul{ color:#1687d9;}

.amarillo{color:#fbd000;}

.verde{ color:#43b047;}

.espacio{width:14px;}
  
/* Posición diferente para cada letra */
.l1{ transform:rotate(-8deg) translateY(3px);}

.l2{ transform:rotate(5deg) translateY(-4px) scale(1.08);}

.l3{transform:rotate(-4deg) translateY(2px);}

.l4{ transform:rotate(7deg) translateY(-5px) scale(1.05);}

.l5{transform:rotate(-6deg) translateY(3px);}

.l6{ transform:rotate(6deg) translateY(-2px) scale(1.08);}

/* Para celulares pequeños 
@media(max-width:360px){
  .titulo-mario{
    font-size:48px;
  }*/
}

/* ===== Animación al tocar sello ===== */
@keyframes sealPress {
  0%   { transform: translate(-50%,-50%) scale(1); }
  55%  { transform: translate(-50%,-50%) scale(.88); }
  100% { transform: translate(-50%,-50%) scale(1); }
}
@keyframes envelopeBounce {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.02); }
  70%  { transform: scale(.995); }
  100% { transform: scale(1); }
}
@keyframes pageFade {
  from { opacity: 1; }
  to   { opacity: 0; }
}

.sealBtn.is-pressed{ animation: sealPress 320ms ease-out; }
.envelopeImg.is-opening{
  transform-origin:center;
  animation: envelopeBounce 420ms cubic-bezier(.2,.9,.2,1);
}
.card.is-fading{ animation: pageFade 240ms ease-in forwards; }

/* Extra: pantallas muy pequeñas */
@media (max-width:360px){
  .hero img{ width:220px; }
  .subtitle{ font-size:23px; }
  .envelopeWrap{ max-width:300px; }
  .paseWrap img{ width:390px; max-width:138%; }
}
</style>
</head>

<body>
  <div class="phone">
    <section class="card" id="card">
      <!-- Elefante -->
      <div class="hero">
        <img src="img/superemilio.png" alt="superEmilio">
      </div>

<audio id="bgMusic" preload="auto" loop>
  <source src="img/musica.mp3" type="audio/mpeg">
</audio>


      <!-- Texto -->
      <h1 class="titulo-mario">
  <span class="letra rojo l1">M</span>
  <span class="letra azul l2">i</span>

  <span class="espacio"></span>

  <span class="letra amarillo l3">P</span>
  <span class="letra verde l4">r</span>
  <span class="letra rojo l5">i</span>
  <span class="letra azul l6">m</span>
  <span class="letra amarillo l1">e</span>
  <span class="letra verde l2">r</span>

  <span class="espacio"></span>

  <span class="letra rojo l3">a</span>
  <span class="letra azul l4">ñ</span>
  <span class="letra amarillo l5">i</span>
  <span class="letra verde l6">t</span>
  <span class="letra rojo l1">o</span>
      </h1>

      <!-- Sobre + Pase -->
      <div class="envelopeWrap">
        <div class="envelopeImg" id="envelopeImg" aria-label="Sobre">


<div class="texto-sobre">
  Toca el sello<br>
  para abrir
</div>
          <!-- Sello -->
          <button class="sealBtn" id="sealBtn" type="button" aria-label="Ver invitación">
            <img src="img/sello.png" alt="Sello estrella">
          </button>

        </div>

        <!-- Pase -->
        <div class="paseWrap">
          <img src="img/pase.png" alt="Pase personal">
        </div>
      </div>
    </section>
  </div>

<script>
  const nextUrl = "invitacion.html"; // hoja 2

  function goNext(){
    const sealBtn = document.getElementById("sealBtn");
    const envelopeImg = document.getElementById("envelopeImg");
    const card = document.getElementById("card");
    const music = document.getElementById("bgMusic");

    if(!sealBtn || !envelopeImg || !card){
      window.location.href = nextUrl;
      return;
    }

    if(sealBtn.dataset.busy === "1") return;
    sealBtn.dataset.busy = "1";

   // ✅ Solo guardar bandera para que la hoja 2 intente reproducir
try { sessionStorage.setItem("playMusicOnNextPage", "1"); } catch(e){}


    sealBtn.classList.add("is-pressed");
    envelopeImg.classList.add("is-opening");

    setTimeout(() => card.classList.add("is-fading"), 180);
    setTimeout(() => window.location.href = nextUrl, 420);
  }

  document.addEventListener("DOMContentLoaded", () => {
    const sealBtn = document.getElementById("sealBtn");
    if(sealBtn) sealBtn.addEventListener("click", goNext);
  });
</script>

</body>
</html>
